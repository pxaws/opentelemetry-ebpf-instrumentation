extensions:
  # SigV4 signer for the CloudWatch Metrics OTLP endpoint (service "monitoring").
  # Region comes from the environment, not from this file: the file is shared with the us-west-2 rig
  # whose documented redeploy is "write it and restart", so a hardcoded region puts cross-region
  # publication one command away — and two rigs publishing identical metric names into one account is
  # unattributable after the fact (KTD11).
  sigv4auth:
    region: ${env:AWS_REGION}
    service: monitoring
  # SigV4 signer for the CloudWatch/X-Ray traces OTLP endpoint (service "xray").
  # The service name stays explicit: it is not auto-detected for the metrics endpoint.
  sigv4auth/xray:
    region: ${env:AWS_REGION}
    service: xray

receivers:
  obi:
    open_port: "8000"
    log_level: INFO
    ebpf:
      context_propagation: "all"
      bpf_fs_base_dir: /sys/fs/bpf
    metrics:
      features: "application"

processors:
  batch:
    timeout: 5s
    # Both caps, not just the trigger. send_batch_size only says when to FLUSH; without
    # send_batch_max_size the maximum is unbounded, so a burst produces one oversized request that the
    # metrics endpoint rejects wholesale (KTD12).
    send_batch_size: 1024
    send_batch_max_size: 1024
  # CloudWatch OTLP requires DELTA temporality; OBI emits cumulative and has no configuration key for
  # it, so the entire delta contract rests on this processor. Both metric exporters sit downstream of
  # it on one pipeline for that reason (KTD8) — an exporter outside the pipeline would ship cumulative,
  # and the count arm would then return wrong numbers silently instead of failing.
  cumulativetodelta: {}

  # AWS-flavored resource attributes on every span AND metric. OBI's EC2 detection
  # sets host.id / cloud.account.id / cloud.region; copy to the requested keys and
  # derive host.ip from the ip-a-b-c-d internal hostname.
  # aws.vpc.id / aws.subnet.id are NOT in OBI's detection: they come from the host's IMDS,
  # passed as AWS_VPC_ID / AWS_SUBNET_ID env at deploy and substituted at config load.
  # The ${env:VAR:-} default form (not plain ${env:VAR}) lets this one shared file load
  # cleanly on a host that lacks the env -- it omits the attribute instead of failing at
  # load, so payment/audit stay safe if this file ever reaches them (KTD12, KTD8).
  transform/aws:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["ec2.instance.id"], attributes["host.id"]) where attributes["host.id"] != nil
          - set(attributes["aws.account.id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["aws.region"], attributes["cloud.region"]) where attributes["cloud.region"] != nil
          - set(attributes["aws.vpc.id"], "${env:AWS_VPC_ID:-}") where "${env:AWS_VPC_ID:-}" != ""
          - set(attributes["aws.subnet.id"], "${env:AWS_SUBNET_ID:-}") where "${env:AWS_SUBNET_ID:-}" != ""
          - set(attributes["host.ip"], attributes["host.name"]) where attributes["host.name"] != nil
          - replace_pattern(attributes["host.ip"], "^ip-([0-9]+)-([0-9]+)-([0-9]+)-([0-9]+).*$", "$$1.$$2.$$3.$$4") where attributes["host.ip"] != nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["ec2.instance.id"], attributes["host.id"]) where attributes["host.id"] != nil
          - set(attributes["aws.account.id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["aws.region"], attributes["cloud.region"]) where attributes["cloud.region"] != nil
          - set(attributes["aws.vpc.id"], "${env:AWS_VPC_ID:-}") where "${env:AWS_VPC_ID:-}" != ""
          - set(attributes["aws.subnet.id"], "${env:AWS_SUBNET_ID:-}") where "${env:AWS_SUBNET_ID:-}" != ""
          - set(attributes["host.ip"], attributes["host.name"]) where attributes["host.name"] != nil
          - replace_pattern(attributes["host.ip"], "^ip-([0-9]+)-([0-9]+)-([0-9]+)-([0-9]+).*$", "$$1.$$2.$$3.$$4") where attributes["host.ip"] != nil

exporters:
  debug:
    verbosity: normal
  # CloudWatch Metrics OTLP ingest. otlp_http appends /v1/metrics.
  # `otlp_http`, not the deprecated `otlphttp` alias — this collector build (v0.151) names it
  # otlp_http, and the alias is one release from being removed.
  otlp_http/cloudwatch:
    endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com
    compression: gzip
    auth:
      authenticator: sigv4auth
  # CloudWatch/X-Ray traces OTLP ingest. otlp_http appends /v1/traces.
  otlp_http/xray:
    endpoint: https://xray.${env:AWS_REGION}.amazonaws.com
    compression: gzip
    auth:
      authenticator: sigv4auth/xray
  # The bridge instance's OTLP receiver, which wraps each export as one Kafka record for the desktop's
  # ingestion consumer. No authenticator: it is reachable only from inside the fleet's security group.
  #
  # Bounded on purpose (KTD12). With retries ON, each stuck request occupies a queue consumer for the
  # whole retry window and the queue fills, so a dead bridge would grow the collector's memory until
  # the OOM killer takes it -- and an OOM-killed collector drops batches, which reads as the agent
  # limitation this rig exists to measure.
  #
  # A FULL queue does not by itself endanger the CloudWatch arm: the fan-out does not stop at the first
  # error, and the batch processor's asynchronous boundary sits in front of both exporters. What WOULD
  # endanger it is blocking on overflow, waiting for results, or disabling the queue -- each of those
  # moves the stall onto the pipeline's own path. All three are deliberately absent below.
  otlp_http/bridge:
    endpoint: ${env:OMNI_BRIDGE_ENDPOINT}
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 2

service:
  extensions: [sigv4auth, sigv4auth/xray]
  telemetry:
    logs:
      level: info
    metrics:
      # The fleet-health gate reads this endpoint per host over SSM: accepted points, queue size,
      # resident memory, and send failures for BOTH metric exporters. A CloudWatch-arm failure is what
      # makes a node value read zero, and a bridge-arm failure is what empties the map -- the two
      # symptoms attribution exists to tell apart (KTD22).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # OBI-native RED -> CloudWatch (node values) AND the bridge (topology). ONE pipeline, so both
    # planes carry the same batch under the same timestamps and the same temporality (R3): the
    # processors run once, and the fan-out happens after cumulativetodelta.
    metrics:
      receivers: [obi]
      processors: [transform/aws, cumulativetodelta, batch]
      exporters: [otlp_http/cloudwatch, otlp_http/bridge, debug]
    # All spans -> CloudWatch/X-Ray OTLP, with the same AWS resource attrs. Unchanged: the local Omni
    # stack reads metrics only, and traces into it are out of scope.
    traces:
      receivers: [obi]
      processors: [transform/aws, batch]
      exporters: [otlp_http/xray, debug]
